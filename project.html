<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LeadsBee - Creative Web Design & Development Agency">
    <title>LeadsBee - Projects</title>
    
    <!-- Updated CDN links -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./asset/css/style.css">
    <link rel="stylesheet" href="./asset/css/responsive.css">
</head>

<body>
    <!-- Header Start -->
    <header class="header contact-header">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light main-menu fixed-top">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="./asset/image/Logo.png" alt="LeadsBee Logo">
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" 
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="./project.html">Project</a></li>
                        <li class="nav-item"><a class="nav-link" href="./service.html">Service</a></li>
                        <li class="nav-item"><a class="nav-link" href="./team.html">Team</a></li>
                        <li class="nav-item"><a class="nav-link" href="./blog.html">Blog</a></li>
                        <li class="nav-item">
                            <a class="btn btn-primary nav-link" href="./contact-us.html">
                                Contact Us <i class="fas fa-angle-right"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Banner -->
        <div class="container header-content">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="mb-3">Our <span class="highlight">Projects</span></h1>
                    <p class="lead">Home / Project</p>
                </div>
                <div class="col-md-6">
                    <img src="./asset/image/Group 1387.png" alt="Project illustration" class="img-fluid">
                </div>
            </div>
        </div>
    </header>

    <!-- Portfolio Section -->
    <main class="portfolio section-padding">
        <div class="container">
            <h2 class="text-center mb-5">My Company <span class="highlight">Work</span></h2>
            
            <!-- Filter Controls -->
            <div class="row mb-4">
                <div class="col-12 text-center">
                    <div class="btn-group" role="group" aria-label="Portfolio filter">
                        <button type="button" class="btn btn-outline-secondary" data-filter="all">All</button>
                        <button type="button" class="btn btn-outline-secondary" data-filter=".design">Design</button>
                        <button type="button" class="btn btn-outline-secondary" data-filter=".development">Development</button>
                        <button type="button" class="btn btn-outline-secondary" data-filter=".case">Case Study</button>
                    </div>
                </div>
            </div>

            <!-- Portfolio Grid -->
            <div class="row portfolio-grid">
                <!-- Repeat this block for each portfolio item -->
                <div class="col-lg-4 col-md-6 mb-4 mix design">
                    <div class="portfolio-item">
                        <img src="./asset/image/Portfolio1.svg" alt="Design project example" class="img-fluid">
                        <div class="portfolio-overlay">
                            <h3>Project Title</h3>
                            <p>Design Category</p>
                        </div>
                    </div>
                </div>
                <!-- Add more portfolio items following the same structure -->
            </div>
        </div>
    </main>

    <!-- CTA Section -->
    <section class="cta section-padding">
        <div class="container text-center">
            <h2 class="mb-4">Any Consultation For Creative Solutions</h2>
            <div class="btn-group">
                <a href="#contact" class="btn btn-primary">Let's Talk</a>
                <a href="#portfolio" class="btn btn-outline-light">Explore More</a>
            </div>
        </div>
    </section>

    <!-- Testimonials -->
    <section class="testimonials section-padding">
        <!-- Carousel structure improved with proper ARIA labels -->
    </section>

    <!-- Footer -->
    <footer class="footer section-padding">
        <div class="container">
            <div class="row">
                <!-- Footer columns with semantic markup -->
            </div>
            <div class="row border-top pt-3">
                <div class="col-md-10">
                    <p class="text-muted">&copy; 2023 LeadsBee Design Company. All rights reserved.</p>
                </div>
                <div class="col-md-2 text-right">
                    <a href="#messenger" class="btn btn-link" aria-label="Contact via Messenger">
                        <i class="fab fa-facebook-messenger fa-2x"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./asset/js/mixitup.min.js"></script>
    <script src="./asset/js/main.js"></script>
</body>
</html>
